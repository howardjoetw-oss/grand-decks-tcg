name: GRAND DECKS - tournament and card metadata sync
on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC. 18:23 UTC = 02:23 Taiwan next day.
    - cron: '23 18 * * *'
permissions:
  contents: write
concurrency:
  group: grand-decks-daily-sync
  cancel-in-progress: false
jobs:
  test-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTML parser (free)
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.12.3
      - name: Test all source parsers and schema
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Source collection + resilient summaries
        run: python scripts/run_sync.py
      - name: Validate generated JSON
        run: |
          python -m json.tool public/data/decks.json > /dev/null
          python -m json.tool public/data/meta.json > /dev/null
          python -m json.tool public/data/integrity.json > /dev/null
          python -m json.tool public/data/sync-status.json > /dev/null
          python -m json.tool public/data/cards.json > /dev/null
      - name: Commit only if published data changed
        run: |
          if ! git diff --quiet -- public/data; then
            git config user.name 'grand-decks-bot'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add public/data
            git commit -m 'chore: refresh sourced OPTCG dataset'
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo 'No data changes.'
          fi
